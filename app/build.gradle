plugins { id 'com.android.application' }
android {
    namespace 'com.pearos.launcher'
    compileSdk 34
    defaultConfig {
        applicationId 'com.pearos.launcher'
        minSdk 25
        targetSdk 30
        versionCode 1
        versionName '1.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
